<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para o Amor da Minha Vida ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff4d6d,#ff8fab);
    font-family:Arial, sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
    color:white;
}

.foto{
    width:220px;
    height:220px;
    border-radius:50%;
    object-fit:cover;
    border:6px solid white;
    box-shadow:0 0 25px rgba(255,255,255,0.6);
}

.nome{
    font-size:42px;
    margin-top:20px;
    font-weight:bold;
}

.mensagem{
    font-size:28px;
    margin-top:15px;
}

.coracao{
    font-size:80px;
    animation:pulsar 1s infinite;
    display:inline-block;
    margin-top:20px;
}

@keyframes pulsar{
    0%{transform:scale(1);}
    50%{transform:scale(1.3);}
    100%{transform:scale(1);}
}

.heart{
    position:absolute;
    color:white;
    animation:subir 8s linear infinite;
    opacity:0.7;
}

@keyframes subir{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    to{
        transform:translateY(-100px);
        opacity:1;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- Troque FOTO.jpg pela foto dela -->
    <img src="FOTO.jpg" class="foto">

    <!-- Troque pelo nome dela -->
    <div class="nome">NOME DELA</div>

    <div class="mensagem">
        Eu te amo mais do que as palavras podem dizer ❤️
    </div>

    <div class="coracao">❤️</div>

</div>

<script>
function criarCoracao(){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="❤";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*40)+"px";
    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },8000);
}

setInterval(criarCoracao,300);
</script>

</body>
</html>
